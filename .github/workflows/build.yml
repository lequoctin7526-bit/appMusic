name: Build & Package WaveMix iOS Release IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Archive WaveMix iOS
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Run Unit Tests
        run: |
          DEVICE=$(xcrun simctl list devices available iPhone | grep -E "iPhone" | head -n 1 | sed -E 's/.*\(([-0-9A-F]+)\).*/\1/')
          if [ -z "$DEVICE" ]; then
            DEST="platform=iOS Simulator,OS=latest"
          else
            DEST="platform=iOS Simulator,id=$DEVICE"
          fi
          echo "Testing on destination: $DEST"
          xcodebuild test \
            -project WaveMix.xcodeproj \
            -scheme WaveMixTests \
            -destination "$DEST" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build & Archive Release
        run: |
          mkdir -p build/IPA
          xcodebuild archive \
            -project WaveMix.xcodeproj \
            -scheme WaveMix \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WaveMix.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          mkdir -p Payload
          cp -r build/WaveMix.xcarchive/Products/Applications/WaveMix.app Payload/
          zip -r build/IPA/WaveMix.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveMix-iOS-Release-IPA
          path: build/IPA/WaveMix.ipa
