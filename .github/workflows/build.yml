name: Build & Package WaveMix iOS Release IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Archive WaveMix iOS
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project WaveMix.xcodeproj \
            -scheme WaveMixTests \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build & Archive Release
        run: |
          mkdir -p build/IPA
          xcodebuild archive \
            -project WaveMix.xcodeproj \
            -scheme WaveMix \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WaveMix.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          mkdir -p Payload
          cp -r build/WaveMix.xcarchive/Products/Applications/WaveMix.app Payload/
          zip -r build/IPA/WaveMix.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveMix-iOS-Release-IPA
          path: build/IPA/WaveMix.ipa
